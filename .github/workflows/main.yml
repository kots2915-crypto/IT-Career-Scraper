name: Daily IT Job Scraper

on:
  schedule:
    - cron: '0 1 * * *'   # 1:00 AM UTC = 8:00 AM Vietnam (tránh giờ cao điểm API)
  workflow_dispatch:       # Cho phép chạy thủ công trên GitHub UI
  push:
    branches: [main]
    paths:
      - 'scraper.py'       # Chỉ trigger khi sửa scraper, không phải mọi push

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30    # Tránh job treo vô tận, tốn quota

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Cache pip để không install lại mỗi lần → nhanh hơn ~30s
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pandas==2.2.2 requests==2.32.3

      # Bước kiểm tra API key trước khi chạy — fail sớm nếu thiếu secret
      - name: Validate API Keys
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          if [ -z "$ADZUNA_APP_ID" ] || [ -z "$ADZUNA_APP_KEY" ]; then
            echo "❌ Thiếu ADZUNA_APP_ID hoặc ADZUNA_APP_KEY trong GitHub Secrets!"
            exit 1
          fi
          echo "✅ API keys OK"

      - name: Run Scraper
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scraper.py

      # Kiểm tra có file mới không trước khi commit
      - name: Check for new data
        id: check_changes
        run: |
          if git diff --quiet data/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Không có job mới hôm nay, bỏ qua commit."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Có dữ liệu mới, chuẩn bị commit."
          fi

      - name: Commit and Push New Data
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-sync: New jobs ${{ github.run_id }}"
          file_pattern: 'data/*.csv'
          # Bỏ --force để không overwrite lịch sử commit
